name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.31" # same uv as the lockfile was written with
          python-version: "3.13"
      - name: Dependencies
        run: uv sync --locked
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (coverage floor in pyproject.toml)
        run: uv run pytest --cov --cov-report=term-missing
      - name: Evidence is reproducible
        run: uv run python tasks.py evidence-check
      - name: Health check
        run: uv run python -m whatsapp_attendant health
      - name: Example config is valid
        run: uv run python -m whatsapp_attendant check-config config.example.toml

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          VERSAO: "8.30.1"
          # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, pinned here so a replaced release asset
          # (and its checksums file) cannot pass. Update both values together.
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          arquivo="gitleaks_${VERSAO}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/${arquivo}"
          echo "${SHA256}  ${arquivo}" | sha256sum --check --strict
          tar xzf "${arquivo}" gitleaks
          ./gitleaks git --redact --no-banner .

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Conventional commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for s in $(git log --no-merges --format=%H "$BASE_SHA..$HEAD_SHA"); do
            m=$(git log -1 --format=%s "$s")
            echo "$m" | grep -Eq '^(feat|fix|docs|chore|refactor|test|ci|build|perf|style|revert)(\([a-z0-9._-]+\))?!?: .+' || { echo "not conventional: $m"; bad=1; }
          done
          exit $bad
